[Rain]
Slant                     = 1.0
; IsRainHittingPlayer: runs the player rain probe for the OBSE IsRainHittingPlayer command, which
; returns 0 while this is off.
IsRainHittingPlayer       = 1

[Snow]
DepthStep                 = 2.5
Flakes                    = 0.5
Speed                     = 1.8
Slant                     = 1.5

[WetWorld]
Amount                    = 0.85
Increase                  = 0.001
Decrease                  = 0.0001
PuddleCoeff_R             = 0.72
PuddleCoeff_G             = 0.62
PuddleCoeff_B             = 0.48
PuddleSpecularMultiplier  = 0.2

[SnowAccumulation]
Amount                    = 1.6
Increase                  = 0.0005
Decrease                  = 0.0001
SunPower                  = 0.3
BlurNormDropThreshhold    = 0.82
BlurRadiusMultiplier      = 0.6

; Wet actors: actors soak up rain and dry off. Exteriors only (actors still dry indoors).
; SoakTime / DryTime are real seconds of unpaused play; DryPerSkippedHour applies to game hours skipped
; by waiting, sleeping or fast travel. NPCExposure: 0 = wet whenever it rains and they are outdoors,
; 1 = test the rain probe for the nearest MaxProbedNPCs (at most 24) within ProbeRadius (capped at
; [ExteriorsOrtho] ShadowMapRadius in Shadows.ini); NPCs beyond that use the outdoors test.
[WetActors]
Enabled                   = 1
SoakTime                  = 90.0
DryTime                   = 480.0
DryPerSkippedHour         = 0.5
NPCExposure               = 1
ProbeRadius               = 1500.0
MaxProbedNPCs             = 16
Darkening                 = 0.4
Sheen                     = 0.6
Glossiness                = 48.0
