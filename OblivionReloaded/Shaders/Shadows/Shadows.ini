[Exteriors]
; Darkness: how much light reaches a shadowed pixel (0 = black shadow, 1 = invisible/no shadow).
; Clear-weather value; Cloudy and Rainy/Snow weather use the lighter tiers below instead.
Darkness                 = 0.5
; Darkness used instead of the above while the current weather is classified Cloudy.
DarknessCloudy           = 0.7
; Darkness used instead of the above while the current weather is classified Rainy or Snow.
DarknessPrecipitation    = 0.9
ShadowMapFarPlane        =8192
UsePostProcessing=1
UseIntervalUpdate=0
UseInstancing=1
; Minimum light elevation (ShadowLightDir.z) for the directional shadow pass to run at all. Below
; this the whole pass is skipped -- and the apply shader now skips with it, so shadows switch off
; cleanly rather than detaching. (Before that coupling was fixed, the apply kept sampling the still
; resident maps with a frozen camera->light matrix, so shadows swam with the camera and the only
; safe value was one low enough to disable the check entirely.)
;
; -1.0 means "never skip": the pass stays alive through dusk and night. That is the default because
; it is the only value that keeps shadows CONTINUOUS across the sunset handover. During Sunset/Dusk
; the engine still points ShadowLightDir at the setting SUN; the dominant moon only takes over once
; MasserAmount rises (ShaderManager.cpp:1419). Any positive threshold cuts shadows off in the gap
; between those two, so they vanish for part of the evening and come back.
;
; Raising it (e.g. 0.15) buys back the night-time cost of the pass, at the price of that gap and of
; moon shadows generally. Two things to know before you do:
;   - Continuous moon shadows need [Main] DirectionalLightOverride = 1 (its code default is 0).
;     With the override off, night keeps using the SUN direction, which is below the horizon, so a
;     low threshold would bake shadows from underground -- there, a positive value is correct.
;   - On a moonless night MasserDir is zeroed, so ShadowLightDir becomes (0,0,0). Its z of 0 passes
;     a negative threshold, and the shadow eye then degenerates onto its own target.
SunUpThreshold           = -1.0
; Adaptive sun-facing bias. 0 = legacy bias math (encoded normal, abs()'d light dir, unclamped
; slope, clip-space normal offset). 1 = signed N.L, terminator ramp, clamped slope, world-space
; offset. The two deferred*NormBias keys change UNITS between the two paths -- see below.
AdaptiveBias            = 1
; Smoothstep upper bound on N.L. Below this, a surface is treated as facing away from the sun and
; takes the shadow term directly without a depth compare. AdaptiveBias only.
;
; 0 DISABLES the ramp, and that is the default: it FLAT-SHADES the scene. The apply pass only has
; the screen-space normal, which is the GEOMETRIC face normal (constant across a triangle), so this
; ramp multiplies whole triangles by Darkness while the engine's Gouraud shading still lights them
; -- rocks, terrain and bodies break into hard-edged dark facets. With the ramp off, sun-away
; surfaces are still shadowed, but by the depth compare (their object's lit side is in the shadow
; map), so the boundary follows the silhouette instead of triangle edges.
;
; Raise it (0.15 was the old default) only to trade those facets back for suppressing acne in the
; terminator band, where the reconstructed normals are least reliable -- grass and foliage at
; dawn/dusk are the usual offenders.
BiasTerminatorWidth     = 0
; Clamp on the slope-scaled bias multiplier. Final bias is deferred*ConstBias * (1 + slope), so
; this sets the peak at 1 + BiasMaxSlope times the constant. AdaptiveBias only.
BiasMaxSlope            = 4.0
; Normal offset. UNITS DEPEND ON AdaptiveBias: shadow-map texels when 1 (scaled on the CPU by each
; cascade's world-units-per-texel), raw clip-space when 0. Legacy values were -0.03 / -0.03.
deferredNormBias        = 1.5
deferredFarNormBias     = 1.5
; Constant depth bias, in normalized shadow-map depth. Under AdaptiveBias the effective bias is
; this * (1 + slope), clamped to a peak of 1 + BiasMaxSlope times the value.
; These are IN-GAME TUNED values, and they are NOT lower than the legacy ones (0.0004 / 0.001) even
; though the slope term now multiplies them. The reason: the legacy path's UNCLAMPED tan(acos())
; inflated the bias on every surface, because its cosTheta was computed from an encoded normal and
; an abs()'d light dir and was therefore meaningless. Clamping the slope term correctly removed that
; blanket inflation, so the constant had to come back up -- the (1 + slope) multiplier only does
; anything on TILTED surfaces, and is ~1.0 on surfaces facing the sun, which is where acne appeared.
; NOTE: these same two values are also consumed by VolumetricLight.fx.hlsl (as TESR_ShadowBiasDeferred
; .z/.w) as FLAT depth biases -- no (1 + slope) multiplier and no AdaptiveBias gate. At these values
; its near bias is 2.5x its old one and its far bias is unchanged, so if that effect is enabled
; ([Main] Effects.VolumetricLight, default 0) expect its shafts to shadow slightly later, not acne.
deferredConstBias       = 0.000
deferredFarConstBias    = 0.001

; Real-time seconds over which a change to the cached Near/Far static shadow maps crossfades in or
; out. Applies to every change, whatever caused it -- cell load/unload, look-at drift past the rebake
; guard band, or sun rotation past RebakeSunInterval. REAL seconds, so an accelerated timescale does
; not shorten it. While a crossfade is in flight, rebakes are held off until it finishes: both map
; buffers hold depths, and there is no meaningful way to lerp two depths, so a second rebake cannot be
; folded into a fade already running. Costs two extra R32F maps (~32 MB at ShadowMapSize 2048) and,
; only while fading, a second set of PCF taps.
; 0 disables it entirely: no extra textures, no extra taps, output identical to before the feature.
; Ignored when CacheStaticShadows = 0 (code default 1, not a key in this file): that setting rebakes
; both static maps every frame instead of caching them, so nothing ever pops and there is nothing to
; crossfade from.
FadeTime                = 1.0

[ExteriorsNear]
Enabled                  =1
AlphaEnabled             =0
Activators               = 1
Actors                   = 1
Apparatus                = 0
Books                    = 0
Containers               = 1
Doors                    = 1
Furniture                = 0
Misc                     = 0
Statics                  = 1
Trees                    = 1
ShadowMapSize            = 2048
ShadowMapRadius          = 2048

[ExteriorsFar]
Enabled                  =1
AlphaEnabled             =0
Activators               = 0
Actors                   = 0
Apparatus                = 0
Books                    = 0
Containers               = 0
Doors                    = 1
Furniture                = 0
Misc                     = 0
Statics                  = 1
Trees                    = 1
ShadowMapSize            = 2048
ShadowMapRadius          = 8192

[ExteriorsSkin]
Enabled                  =1
AlphaEnabled             =0
Activators               = 0
Actors                   = 1
Apparatus                = 0
Books                    = 0
Containers               = 0
Doors                    = 1
Furniture                = 0
Misc                     = 0
Statics                  = 1
Trees                    = 1
ShadowMapSize            = 2048
ShadowMapRadius          = 2048

; This is like a shadow map, but it is taken from the Zenit; if disabled, effects like rain, snow, snow accumulation will no more be able to avoid precipitations under objects
[ExteriorsOrtho]
Enabled                  = 1
AlphaEnabled             = 1
Activators               = 0
Actors                   = 0
Apparatus                = 0
Books                    = 0
Containers               = 0
Doors                    = 0
Furniture                = 0
Misc                     = 0
Statics                  = 1
Trees                    = 0
ShadowMapSize            = 512
ShadowMapRadius          = 2048.0
; Bias on the precipitation occlusion compare, in WORLD UNITS (converted to normalized ortho depth
; on the CPU, so it stays meaningful if ShadowMapFarPlane changes). Rain/Snow march a ray from the
; camera to the surface and average how many steps were open sky; steps that land within a texel of
; a ceiling sit right on the stored depth, where an unbiased compare flips either way and leaks a
; little rain through solid cover. This pushes those borderline samples to "occluded".
;
; Scale it against the map's texel size: at ShadowMapSize 512 over ShadowMapRadius 2048, one texel
; is 8 world units. Raising it costs a small halo of over-occlusion past roof EDGES (rain stopping
; slightly outside the cover), which is far less visible than rain indoors. 0 restores the old
; unbiased compare. Does not affect SnowAccumulation, which PCF-filters the same map separately.
OcclusionBias            = 16.0

; Unified point-light shadows (torches, fires, candles) — identical behavior in interiors and
; exteriors. Up to LightCount lights (max 4) each render a cached shadow cube map.
; Shadow darkness is derived per-light from its colour and falloff, not a fixed value here.
; Overlapping lights' shadows combine multiplicatively, so overlaps read darker than a single light.
[Point]
Enabled                  = 1
UsePostProcessing        = 1
AlphaEnabled             = 1
TorchesCastShadows       = 1
ShadowCubeMapSize        = 512
; Number of simultaneous shadow-casting lights (1..4). Main performance lever.
LightCount               = 4
; Candidate lights must have a radius within these bounds...
LightRadiusMin           = 64
LightRadiusMax           = 8192
; ...and be within this distance of the player.
MaxDistance              = 8192
; Depth bias in normalized cube distance (so it scales with each light's radius).
; Raise to kill shadow acne, lower if shadows detach from their casters.
Bias                     = 0.01
Activators               = 1
Actors                   = 1
Apparatus                = 1
Books                    = 0
Containers               = 1
Doors                    = 0
Furniture                = 1
Misc                     = 0
Statics                  = 1
Trees                    = 1

; By default, all forms cast shadows
; These section is reserved to specify if a FormID can cast shadows
; Example E00000007 = 0, it does not cast for exteriors
; Example N00000007 = 0, it does not cast for exteriors at night
; Example I00000007 = 0, it does not cast for interiors
; Example X00000007 = 0, it does not cast shadows for exteriors and interiors
[FormIDs]
X6157 = 0
N6158 = 0
N3961 = 0
N436236 = 0
I591142 = 0
I150387 = 0
I52972 = 0
I563396 = 0
I760032 = 0
I760031 = 0
N827224 = 0
N827223 = 0
N803443 = 0
N803442 = 0
