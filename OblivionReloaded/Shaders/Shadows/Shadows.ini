; This is like a shadow map, but it is taken from the Zenit; if disabled, effects like rain, snow, snow accumulation will no more be able to avoid precipitations under objects
[ExteriorsOrtho]
Enabled                  = 1
AlphaEnabled             = 1
Activators               = 0
Actors                   = 0
Apparatus                = 0
Books                    = 0
Containers               = 0
Doors                    = 0
Furniture                = 0
Misc                     = 0
Statics                  = 1
Trees                    = 0
ShadowMapSize            = 512
ShadowMapRadius          = 2048.0

; Unified point-light shadows (torches, fires, candles) — identical behavior in interiors and
; exteriors. Up to LightCount lights (max 4) each render a cached shadow cube map.
[Point]
Enabled                  = 1
UsePostProcessing        = 1
AlphaEnabled             = 1
TorchesCastShadows       = 1
ShadowCubeMapSize        = 512
; Number of simultaneous shadow-casting lights (1..4). Main performance lever.
LightCount               = 4
; How much light reaches a point-shadowed pixel (0 = black, 1 = invisible).
; Torch/fire shadows are softened heavily by ambient bounce in reality, so this stays well
; above 0. Note lights combine multiplicatively, so overlaps are darker than a single light.
Darkness                 = 0.7
; Candidate lights must have a radius within these bounds...
LightRadiusMin           = 64
LightRadiusMax           = 8192
; ...and be within this distance of the player.
MaxDistance              = 8192
; Depth bias in normalized cube distance (so it scales with each light's radius).
; Raise to kill shadow acne, lower if shadows detach from their casters.
Bias                     = 0.01
Activators               = 1
Actors                   = 1
Apparatus                = 1
Books                    = 0
Containers               = 1
Doors                    = 0
Furniture                = 1
Misc                     = 0
Statics                  = 1
Trees                    = 1

; By default, all forms cast shadows
; These section is reserved to specify if a FormID can cast shadows
; Example E00000007 = 0, it does not cast for exteriors
; Example N00000007 = 0, it does not cast for exteriors at night
; Example I00000007 = 0, it does not cast for interiors
; Example X00000007 = 0, it does not cast shadows for exteriors and interiors
[FormIDs]
X6157 = 0
N6158 = 0
N3961 = 0
N436236 = 0
I591142 = 0
I150387 = 0
I52972 = 0
I563396 = 0
I760032 = 0
I760031 = 0
N827224 = 0
N827223 = 0
N803443 = 0
N803442 = 0
