AlphaEnabled             =0
Activators               = 1
Actors                   = 1
Apparatus                = 0
Books                    = 0
Containers               = 1
Doors                    = 1
Furniture                = 0
Misc                     = 0
Statics                  = 1
Trees                    = 1
ShadowMapSize            = 2048
ShadowMapRadius          = 2048

