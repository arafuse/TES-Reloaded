[Exteriors]
; Darkness: how much light reaches a shadowed pixel (0 = black shadow, 1 = invisible/no shadow).
; Clear-weather value; Cloudy and Rainy/Snow weather use the lighter tiers below instead.
Darkness                 = 0.5
; Darkness used instead of the above while the current weather is classified Cloudy.
DarknessCloudy           = 0.7
; Darkness used instead of the above while the current weather is classified Rainy or Snow.
DarknessPrecipitation    = 0.9
ShadowMapFarPlane        =8192
UsePostProcessing=1
UseIntervalUpdate=0
UseInstancing=1
; Adaptive sun-facing bias. 0 = legacy bias math (encoded normal, abs()'d light dir, unclamped
; slope, clip-space normal offset). 1 = signed N.L, terminator ramp, clamped slope, world-space
; offset. The two deferred*NormBias keys change UNITS between the two paths -- see below.
AdaptiveBias            = 1
; Smoothstep upper bound on N.L. Below this, a surface is treated as facing away from the sun and
; takes the shadow term directly without a depth compare. Widen if grass/foliage speckles at
; dawn/dusk (their screen-space normals are the least reliable in the scene). AdaptiveBias only.
BiasTerminatorWidth     = 0.15
; Clamp on the slope-scaled bias multiplier. Final bias is deferred*ConstBias * (1 + slope), so
; this sets the peak at 1 + BiasMaxSlope times the constant. AdaptiveBias only.
BiasMaxSlope            = 4.0
; Normal offset. UNITS DEPEND ON AdaptiveBias: shadow-map texels when 1 (scaled on the CPU by each
; cascade's world-units-per-texel), raw clip-space when 0. Legacy values were -0.03 / -0.03.
deferredNormBias        = 1.5
deferredFarNormBias     = 1.5
; Constant depth bias, in normalized shadow-map depth. Under AdaptiveBias the effective bias is
; this * (1 + slope), peaking at 1 + BiasMaxSlope times the value, so it sits well below the
; legacy numbers (which were 0.0004 / 0.001 against an UNCLAMPED tan(acos()) multiplier).
; NOTE: these same two values are also consumed by VolumetricLight.fx.hlsl (as TESR_ShadowBiasDeferred
; .z/.w) as FLAT depth biases -- no (1 + slope) multiplier and no AdaptiveBias gate. So lowering them
; here to suit the slope-scaled apply shader reduces VolumetricLight's bias proportionally. That effect
; defaults to off ([Main] Effects.VolumetricLight = 0); if it is enabled and its shadows acne, this is why.
deferredConstBias       = 0.00015
deferredFarConstBias    = 0.0004

[ExteriorsNear]
